name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/vijai/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/vijai/app/
          mv activity_main.xml app/src/main/res/layout/
          mv strings.xml app/src/main/res/values/
          mv styles.xml app/src/main/res/values/
          mv "build (1).gradle" app/build.gradle || mv build.gradle app/build.gradle
          mkdir -p gradle/wrapper
          mv gradle-wrapper.properties gradle/wrapper/
          mv gradle-wrapper.jar gradle/wrapper/

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vij-ai-app
          path: app/build/outputs/apk/debug/app-debug.apk
